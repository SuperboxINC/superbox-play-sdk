name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - run: npm run typecheck
      - run: npm test
      - name: 저장소의 빌드 결과가 소스와 같은지 확인
        run: git status --porcelain && test -z "$(git status --porcelain)"
